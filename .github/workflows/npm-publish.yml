name: npm Trusted Publishing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run quality battery
        run: npm run check

      - name: Validate package tarball
        run: npm run pack:dry-run

      - name: Validate npm publish payload for manual dry run
        if: github.event_name == 'workflow_dispatch'
        run: npm run publish:dry-run:ci

      - name: Validate npm publish payload for release tag
        if: github.event_name != 'workflow_dispatch'
        run: npm run publish:dry-run

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/commonloom
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release tag
        run: npm run release:check

      - name: Run quality battery
        run: npm run check

      - name: Publish to npm
        run: npm publish
